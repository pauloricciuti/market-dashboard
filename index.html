<!DOCTYPE html>
<!--
  MARKET DASHBOARD
  ==================
  This file mixes 3 "languages", each with its own job:

  1. HTML -> the STRUCTURE of the page (what exists: title, buttons, boxes)
  2. CSS  -> the LOOK (colors, sizes, grid). Lives in style.css
  3. JavaScript (JS) -> the BEHAVIOR (building charts, reacting to
     clicks). Lives in app.js

  The charts are NOT drawn by this file: they are TradingView "widgets".
  For each asset, our code loads a small program from TradingView's
  server, which fetches the prices and draws the chart inside the box.
  That's why the file lives on your computer but needs internet to work.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">

  <link rel="stylesheet" href="style.css">

</head>

<body>
  <!-- ---------- HTML: structure ---------- -->
  <header>
    <div>
      <h1>Market Dashboard <span id="clock"></span></h1>
    </div>

    <!-- Opens TradingView's full economic calendar in a new tab -->
    <a class="calendar-link" href="https://www.tradingview.com/economic-calendar/" target="_blank">
      Economic Calendar ↗
    </a>

    <!-- Period buttons. "data-period" holds the code TradingView
         understands: 1D, 1M, 3M, 12M (1 year), 60M (5 years) -->
    <div class="periods">
      <button data-period="1D">1D</button>
      <button data-period="1M">1M</button>
      <button data-period="3M">3M</button>
      <button data-period="12M">1Y</button>
      <button data-period="60M">5Y</button>
    </div>

    <!-- NEW: tab bar. Starts empty: the JavaScript creates one button per tab -->
    <nav class="tabs" id="tabs"></nav>
  </header>

  <!-- Starts empty: the JavaScript fills it with the groups of the current tab -->
  <main id="panel"></main>

  <script src="app.js"></script>

</body>
</html>
